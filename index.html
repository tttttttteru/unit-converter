<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>単位変換 | 変換ツール</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <nav class="sitenav" aria-label="ページ">
      <a href="index.html" aria-current="page">単位変換</a>
      <a href="files.html">ファイル変換</a>
    </nav>

    <h1>単位変換</h1>
    <p class="lead">長さ・重さ・温度・面積・体積・速度など、さまざまな単位を一度に換算します。UNIX時間や進数の変換もできます。</p>

    <div id="tabs" class="tabs" role="tablist" aria-label="ツール">
      <button type="button" role="tab" data-tab="units">単位</button>
      <button type="button" role="tab" data-tab="number">日時・進数</button>
    </div>

    <section id="tab-units" role="tabpanel">
      <!-- カテゴリのボタンは下の <script> が生成する -->
      <nav id="categories" class="categories" aria-label="カテゴリ"></nav>

      <div class="converter">
        <div class="field">
          <label for="value">変換する値</label>
          <input id="value" type="number" step="any" value="1" inputmode="decimal">
          <select id="from" aria-label="変換元の単位"></select>
        </div>
      </div>

      <div aria-live="polite">
        <h2>変換結果</h2>
        <ul id="all" class="all"></ul>
      </div>
    </section>
    <!-- 日時・進数 -->
    <section id="tab-number" class="tool" role="tabpanel" hidden>
      <div class="card">
        <h2>UNIX時間 ⇄ 日時</h2>
        <div class="row">
          <input id="n-ts" type="text" inputmode="decimal" aria-label="UNIX時間または日時" placeholder="UNIX時間、または 2024-01-01 09:00 のような日時" style="flex: 1 1 240px">
          <button type="button" id="n-now" class="btn">現在</button>
        </div>
        <p id="n-ts-err" class="error" role="alert"></p>
        <ul id="n-ts-out" class="all"></ul>
        <p class="note">UNIX時間は 11 桁以下なら秒、12 桁以上ならミリ秒として扱います。日時の入力は、この端末のタイムゾーンで解釈します。</p>
      </div>
      <div class="card">
        <h2>進数変換</h2>
        <div class="row">
          <input id="n-num" type="text" value="255" aria-label="変換する数" spellcheck="false" style="flex: 1 1 240px">
          <select id="n-base" aria-label="入力の進数">
            <option value="2">2進数</option>
            <option value="8">8進数</option>
            <option value="10" selected>10進数</option>
            <option value="16">16進数</option>
            <option value="36">36進数</option>
          </select>
        </div>
        <p id="n-err" class="error" role="alert"></p>
        <ul id="n-base-out" class="all"></ul>
        <p class="note">桁数の大きな数も正確に変換できます。0x や 0b などの接頭辞、スペース、カンマは無視します。</p>
      </div>
    </section>
  </main>

  <script src="common.js"></script>
  <script src="units.js"></script>
  <script src="numbers.js"></script>
</body>
</html>
